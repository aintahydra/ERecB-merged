[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erecb-fileintel"
version = "0.1.0"
description = "Collect executable hashes and enrich them with file intelligence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-magic>=0.4.27",
  "PyYAML>=6.0",
  "requests>=2.31.0",
]

[project.scripts]
erecb-fileintel = "erecb_fileintel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

