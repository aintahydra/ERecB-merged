name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install ".[test]"
      - name: Run tests
        run: python -m pytest
      - name: Run static checks
        run: python -m ruff check .
      - name: Verify installed CLI
        run: |
          ghintel --version
          ghintel --help
          ghintel init --config "$RUNNER_TEMP/ghintel-smoke/config.toml"
          ghintel doctor --config "$RUNNER_TEMP/ghintel-smoke/config.toml" --json > "$RUNNER_TEMP/ghintel-smoke/doctor.json"
          python -c 'import json, os, pathlib; assert json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "ghintel-smoke" / "doctor.json").read_text())["database_ok"]'
