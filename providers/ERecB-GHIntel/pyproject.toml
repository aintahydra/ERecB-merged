[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ghintel"
version = "0.1.2"
description = "Local-first GitHub repository intelligence inventory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ghintel contributors" }]
dependencies = [
  "anthropic>=0.78",
  "google-genai>=1.0",
  "httpx>=0.27",
  "lingua-language-detector>=2.0",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
ghintel = "ghintel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ghintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
