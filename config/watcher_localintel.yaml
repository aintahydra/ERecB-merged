# Combined local-only intelligence profile; no provider or network work occurs in the event path.
watch:
  path: "./in"
  recursive: false
  event_debounce_ms: 500
  stable_check:
    enabled: true
    interval_ms: 250
    unchanged_checks: 3

dispatcher:
  max_workers: 1
  duplicate_policy: "skip_if_output_exists"
  staging_index_path: "./data/staging.sqlite3"
  staging_root: "./middle-earth"
  output_root: "./output"

pipelines:
  on_added:
    preprocessors:
      processors:
        - "stage_input"
    analysis:
      processors:
        - "ip_retriever"
        - "file_retriever"

processors:
  ip_retriever:
    type: "ip_retriever"
    db_path: "./dbs/ipintel.sqlite3"
    output_root: "./output"
    report_suffix: "-ipintel.md"
  file_retriever:
    type: "file_retriever"
    db_path: "./dbs/fileintel.sqlite3"
    output_root: "./output"
    classifier:
      use_magic: false
      extension_fallback: true
    report_suffix: "-fileintel.md"
