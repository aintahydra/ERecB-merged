[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "erecb-triage"
version = "0.1.5"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fileintel = ["python-magic"]
yara = ["yara-python"]

[project.scripts]
erecb-triage = "erecb_triage.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
